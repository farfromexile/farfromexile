<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 310" width="920" height="310" role="img" aria-label="Nihat Burak Şahin — Founder and Lead Architect at Exile CyberLabs">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B0F" />
      <stop offset="55%" stop-color="#110E1B" />
      <stop offset="100%" stop-color="#0B0B0F" />
    </linearGradient>

    <radialGradient id="purpleGlow" cx="18%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#7B2CBF" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#5A189A" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0B0B0F" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanGlow" cx="85%" cy="78%" r="48%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#0B0B0F" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B2CBF" />
      <stop offset="50%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#5A189A" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B2CBF" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#2A1B4E" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0.7" />
    </linearGradient>

    <pattern id="cyberGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#7B2CBF" stroke-width="0.6" stroke-opacity="0.14" />
    </pattern>

    <clipPath id="cardClip">
      <rect x="2" y="2" width="916" height="306" rx="16" ry="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Base Surface -->
    <rect x="2" y="2" width="916" height="306" fill="url(#bgGrad)" />
    <rect x="2" y="2" width="916" height="306" fill="url(#cyberGrid)" />
    <rect x="2" y="2" width="916" height="306" fill="url(#purpleGlow)" />
    <rect x="2" y="2" width="916" height="306" fill="url(#cyanGlow)" />

    <!-- Top Terminal Bar -->
    <rect x="2" y="2" width="916" height="40" fill="#13111C" fill-opacity="0.92" />
    <line x1="2" y1="42" x2="918" y2="42" stroke="#7B2CBF" stroke-opacity="0.35" stroke-width="1" />

    <!-- Window Controls -->
    <circle cx="26" cy="22" r="5.5" fill="#FF5F56" />
    <circle cx="46" cy="22" r="5.5" fill="#FFBD2E" />
    <circle cx="66" cy="22" r="5.5" fill="#27C93F" />

    <!-- Terminal Title -->
    <text x="94" y="26" fill="#9E97B8" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="12" letter-spacing="0.6">
      exile@cyberlabs:~/identity — zero-trust-shell
    </text>

    <!-- Status Pill (Top Right) -->
    <rect x="738" y="10" width="160" height="24" rx="12" fill="#0B0B0F" stroke="#00F5FF" stroke-opacity="0.45" stroke-width="1" />
    <circle cx="755" cy="22" r="4" fill="#00F5FF">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <text x="768" y="26" fill="#00F5FF" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="11" font-weight="700" letter-spacing="1">
      SYS :: ACTIVE
    </text>

    <!-- Right-Side Geometric Cyber Shield Watermark -->
    <g transform="translate(715, 72)" opacity="0.92">
      <polygon points="85,8 156,42 156,112 85,164 14,112 14,42" fill="#120F1D" stroke="#7B2CBF" stroke-width="1.6" stroke-opacity="0.7" />
      <polygon points="85,22 142,50 142,105 85,148 28,105 28,50" fill="none" stroke="#00F5FF" stroke-width="1" stroke-opacity="0.45" stroke-dasharray="6 4" />
      <text x="85" y="84" text-anchor="middle" fill="#FFFFFF" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="22" font-weight="800" letter-spacing="3">EXILE</text>
      <line x1="48" y1="95" x2="122" y2="95" stroke="#00F5FF" stroke-width="1.5" stroke-opacity="0.8" />
      <text x="85" y="113" text-anchor="middle" fill="#00F5FF" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="9.5" font-weight="600" letter-spacing="2.2">CYBERLABS</text>
    </g>

    <!-- Eyebrow Tag + Alias Pill (Zero Font-Width Overlap Across All OS Fonts) -->
    <rect x="44" y="66" width="332" height="26" rx="6" fill="#7B2CBF" fill-opacity="0.18" stroke="#7B2CBF" stroke-opacity="0.6" stroke-width="1" />
    <text x="58" y="83" fill="#00F5FF" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="11.5" font-weight="700" letter-spacing="1.4">
      &gt; FOUNDER &amp; LEAD ARCHITECT @ EXILE CYBERLABS
    </text>

    <rect x="388" y="66" width="128" height="26" rx="6" fill="#00F5FF" fill-opacity="0.12" stroke="#00F5FF" stroke-opacity="0.6" stroke-width="1" />
    <text x="452" y="83" text-anchor="middle" fill="#00F5FF" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="11.5" font-weight="800" letter-spacing="1.6">
      ALIAS :: EXILE
    </text>

    <!-- Main Identity Title -->
    <text x="44" y="138" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="40" font-weight="800" letter-spacing="0.5">
      Nihat Burak Şahin
    </text>

    <!-- Gradient Divider Rule -->
    <rect x="44" y="156" width="590" height="2.5" rx="1.25" fill="url(#accentLine)" />

    <!-- Core Domains Subtitle -->
    <text x="44" y="188" fill="#E2DEF0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="500" letter-spacing="0.3">
      Cybersecurity &amp; DFIR  ·  Autonomous Multi-Agent AI  ·  Zero-Trust Cross-Platform Systems
    </text>
    <text x="44" y="214" fill="#9E97B8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" letter-spacing="0.2">
      Engineering hardened enterprise platforms, forensic intelligence pipelines, and resilient native applications.
    </text>

    <!-- Bottom Telemetry Strip -->
    <rect x="2" y="256" width="916" height="52" fill="#0E0C16" fill-opacity="0.95" />
    <line x1="2" y1="256" x2="918" y2="256" stroke="#7B2CBF" stroke-opacity="0.35" stroke-width="1" />

    <!-- Brand Color Swatches -->
    <text x="44" y="286" fill="#8C84A8" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="11" letter-spacing="1">
      PALETTE:
    </text>
    <rect x="112" y="274" width="14" height="14" rx="3" fill="#7B2CBF" stroke="#FFFFFF" stroke-opacity="0.2" />
    <rect x="132" y="274" width="14" height="14" rx="3" fill="#5A189A" stroke="#FFFFFF" stroke-opacity="0.2" />
    <rect x="152" y="274" width="14" height="14" rx="3" fill="#00F5FF" stroke="#FFFFFF" stroke-opacity="0.2" />
    <rect x="172" y="274" width="14" height="14" rx="3" fill="#0B0B0F" stroke="#00F5FF" stroke-opacity="0.45" />

    <!-- Telemetry Metrics -->
    <text x="222" y="286" fill="#CFC9E6" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="11.5" letter-spacing="0.6">
      ARCH: <tspan fill="#00F5FF" font-weight="700">ZERO-TRUST</tspan>   |   STACK: <tspan fill="#B983FF" font-weight="700">FLUTTER · PYTHON · C++ · KOTLIN</tspan>   |   BASE: <tspan fill="#FFFFFF" font-weight="700">TÜRKİYE</tspan>
    </text>
  </g>

  <!-- Outer Crisp Frame -->
  <rect x="2" y="2" width="916" height="306" rx="16" ry="16" fill="none" stroke="url(#borderGrad)" stroke-width="2" />
</svg>
